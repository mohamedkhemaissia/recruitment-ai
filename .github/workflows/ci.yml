name: Qualité continue

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DVC_NO_ANALYTICS: 'true'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dvc.txt

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Installer DVC
        run: pip install -r requirements-dvc.txt

      - name: Vérifier les scripts IA
        run: npm run ai:validate

      - name: Reproduire le dataset DVC
        run: dvc repro

      - name: Vérifier le verrou DVC
        run: git diff --exit-code -- dvc.lock

      - name: Évaluer le classement IA
        run: npm run ai:evaluate --prefix backend

      - name: Exécuter les tests
        run: npm test

      - name: Construire le frontend
        run: npm run build
